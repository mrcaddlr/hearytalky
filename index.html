<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <meta name="description" content="Near-zero-latency browser microphone monitoring.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>hearytalky</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>hearytalky</h1>
        <p>hear yourself.</p>
      </div>
      <div id="status" class="status" data-state="idle"><span></span> ready</div>
    </header>

    <section class="hero">
      <button id="start" class="start" type="button">Start monitoring</button>
      <p class="headphone-note">Use headphones to prevent audio feedback.</p>
    </section>

    <section class="meter-card" aria-label="Microphone level">
      <div class="meter-label"><span>Input level</span><span id="levelText">-∞ dB</span></div>
      <div class="meter" role="meter" aria-valuemin="-60" aria-valuemax="0" aria-valuenow="-60">
        <div id="meterFill"></div>
        <div id="clipMark"></div>
      </div>
      <div class="meter-scale"><span>-60</span><span>-30</span><span>-12</span><span>-6</span><span>0 dB</span></div>
    </section>

    <section class="controls">
      <label>
        <span>Microphone</span>
        <select id="inputDevice" disabled><option>Default microphone</option></select>
      </label>

      <label>
        <span>Output</span>
        <select id="outputDevice" disabled><option>Default output</option></select>
      </label>

      <label>
        <span>Monitor volume <output id="volumeText">70%</output></span>
        <input id="volume" type="range" min="0" max="100" value="70">
      </label>
    </section>

    <section class="tools">
      <button id="mute" class="secondary" type="button" disabled>Mute monitor</button>
      <button id="shortcut" class="secondary" type="button" disabled>Space: start / stop</button>
    </section>

    <details class="diagnostics">
      <summary>Audio details</summary>
      <dl>
        <div><dt>Audio mode</dt><dd id="audioMode">Not running</dd></div>
        <div><dt>Browser latency</dt><dd id="latency">—</dd></div>
        <div><dt>Output routing</dt><dd id="routing">Default output</dd></div>
      </dl>
    </details>

    <div id="message" class="message" role="status" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
